# Rodar em /opt/app/deploy:
#   docker compose --env-file ../.env -f docker-compose.hml.yml up -d
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: langgraph
      POSTGRES_USER: lg_app
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      - /opt/app/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lg_app -d langgraph"]
      interval: 10s
    restart: unless-stopped   # sem "ports": só a rede interna enxerga

  backend:
    image: ucp-agent-api:latest
    pull_policy: never        # a imagem chega via `docker load` no deploy
    env_file: ../.env
    environment:
      SPRING_PROFILES_ACTIVE: hml
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/langgraph
      SPRING_DATASOURCE_USERNAME: lg_app
      SPRING_DATASOURCE_PASSWORD: ${PG_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/app/web:/srv/web:ro
      - caddy_data:/data
    depends_on: [backend]
    restart: unless-stopped

volumes:
  caddy_data: {}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: backend
          image: ghcr.io/renanpadilha/lang-graph-ucp-poc:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres.data.svc.cluster.local:5432/langgraph
            - name: SPRING_DATASOURCE_USERNAME
              value: lg_app
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=75
          envFrom:
            - secretRef: { name: backend-env }
          readinessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: apps
spec:
  selector: { app: backend }
  ports:
    - port: 8080

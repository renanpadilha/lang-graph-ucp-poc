# Mesmo host do front; /api vai pro backend (sem strip: o app já serve /api).
# O certificado é emitido pelo Ingress do front (secret web-tls); este só reutiliza.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend
  namespace: apps
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: apps-basic-auth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [app.renanpadilha.dev.br]
      secretName: web-tls
  rules:
    - host: app.renanpadilha.dev.br
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: backend, port: { number: 8080 } }
